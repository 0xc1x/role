name: Deploy production

on:
  workflow_dispatch:
    inputs:
      skip_api:
        description: 'Saltar Render API'
        type: boolean
        default: false
      skip_frontends:
        description: 'Saltar Vercel admin + landing'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-api:
    name: render · api production
    if: ${{ inputs.skip_api == false }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Trigger Render deploy hook (prod)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          : "${RENDER_DEPLOY_HOOK_URL:?secret RENDER_DEPLOY_HOOK_URL vacío — configúralo en el environment production}"
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Wait for healthy API
        env:
          API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
        run: |
          : "${API_HEALTH_URL:?secret API_HEALTH_URL vacío — configúralo en el environment production}"
          for i in $(seq 1 30); do
            if curl -fsSL "$API_HEALTH_URL" >/dev/null; then
              echo "API healthy"
              exit 0
            fi
            sleep 20
          done
          echo "API did not become healthy in time" >&2
          exit 1

  deploy-admin:
    name: vercel · admin production
    if: ${{ inputs.skip_frontends == false }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      NITRO_PRESET: vercel
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install (workspace root)
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Pull / build / deploy (prod)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
        run: |
          : "${VERCEL_TOKEN:?secret VERCEL_TOKEN vacío}" "${VERCEL_ORG_ID:?secret VERCEL_ORG_ID vacío}" "${VERCEL_PROJECT_ID:?secret VERCEL_PROJECT_ID_* vacío}"
          npx -y --package=vercel@59 vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx -y --package=vercel@59 vercel build --prod --token="$VERCEL_TOKEN"
          npx -y --package=vercel@59 vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-landing:
    name: vercel · landing production
    if: ${{ inputs.skip_frontends == false }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      NITRO_PRESET: vercel
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install (workspace root)
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Pull / build / deploy (prod)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_LANDING }}
        run: |
          : "${VERCEL_TOKEN:?secret VERCEL_TOKEN vacío}" "${VERCEL_ORG_ID:?secret VERCEL_ORG_ID vacío}" "${VERCEL_PROJECT_ID:?secret VERCEL_PROJECT_ID_* vacío}"
          npx -y --package=vercel@59 vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx -y --package=vercel@59 vercel build --prod --token="$VERCEL_TOKEN"
          npx -y --package=vercel@59 vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
