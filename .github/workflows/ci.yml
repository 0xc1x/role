name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres-test:
        image: postgres:16-alpine
        ports:
          - 6432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: role_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Generate offline DDL mirror for API tests
        working-directory: apps/api
        run: bunx drizzle-kit generate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:6432/role_test

      - name: Test
        run: bun run test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:6432/role_test
          # Dummies para el validador zod de apps/mobile (los tests usan mocks, sin red)
          EXPO_PUBLIC_SUPABASE_URL: https://test.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: test-anon-key

      - name: E2E marketplace
        run: bun run test:e2e
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:6432/role_test

      - name: Build
        run: bun run build
