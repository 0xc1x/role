name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # role-commons is a sibling file: dependency; clone when not present (PR from this monorepo layout).
      - name: Checkout role-commons
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/role-commons
          path: role-commons
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build role-commons (if present)
        working-directory: ../role-commons
        run: |
          if [ -f package.json ]; then
            if command -v bun >/dev/null 2>&1; then
              bun install && bun run build
            else
              npm install && npx tsc -p tsconfig.json
            fi
          else
            echo "role-commons missing — will rely on packaged file: link or skip"
          fi
        continue-on-error: true

      # When commons lives next to the API checkout path used by actions:
      - name: Build role-commons from workspace sibling path
        run: |
          if [ -d role-commons ]; then
            cd role-commons
            npm install --ignore-scripts 2>/dev/null || true
            npx tsc -p tsconfig.json || true
            cd ..
            # Ensure file:../role-commons resolves: link checkout into parent of GITHUB_WORKSPACE
            mkdir -p "$GITHUB_WORKSPACE/../"
            ln -sfn "$GITHUB_WORKSPACE/role-commons" "$GITHUB_WORKSPACE/../role-commons" || true
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:cov -- --ci --maxWorkers=2

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
