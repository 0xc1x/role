  <!-- Estilos base + nativos -->
  <style id="expo-reset">
    html,
    body {
      height: 100%;
      /* Safari iOS tiene DOS alturas de viewport y cada una falla en un
         contexto distinto:
         - 100% = alto del layout viewport (ICB). En la PWA standalone con
           status-bar black-translucent el ICB cubre la pantalla completa
           mientras que el visual viewport (dvh) descuenta la barra de
           estado: 100dvh queda ~47px corto y deja la franja blanca bajo
           la tab bar.
         - 100dvh sigue el viewport dinámico. En Safari con toolbar
           colapsada crece y evita que 100% se quede congelado con la
           medida inicial (la franja clásica al hacer scroll).
         max() toma el MAYOR de los dos: en la PWA gana el ICB (llena la
         pantalla), en Safari gana dvh (sigue la toolbar). Nunca puede
         quedarse más corto que el viewport visible, así que no abre
         franja nueva. Si el navegador no entiende dvh/max(), la
         declaración se descarta y queda 100% como fallback.
         -webkit-fill-available cubre iOS < 15.4 (ignora dvh). */
      height: max(100%, 100dvh);
      min-height: -webkit-fill-available;
      margin: 0;
      padding: 0;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      overflow: hidden;
    }

    /* These styles make the root element full-height */
    #root {
      display: flex;
      height: 100%;
      /* Mismo criterio que html/body: mayor entre ICB y viewport dinámico,
         para que el shell nunca termine por encima del fondo real. */
      height: max(100%, 100dvh);
      min-height: -webkit-fill-available;
      flex: 1;
    }

    /* Desactivar selección de texto */
    * {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    /* Excepciones */
    input,
    textarea,
    [contenteditable="true"],
    .selectable,
    .selectable * {
      -webkit-user-select: text !important;
      user-select: text !important;
      -webkit-touch-callout: default;
    }

    /* Evitar zoom en inputs (iOS) */
    input,
    textarea,
    select {
      font-size: 16px !important;
    }

    /* The first painted canvas must match the app surfaces, not white. */
    :root {
      --page-background: hsl(260 42.86% 98.63%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page-background: hsl(0 0% 7.06%);
      }
    }

    html,
    body,
    #root {
      background-color: var(--page-background);
    }

    /* iOS standalone uses the native launch image while the page hydrates. */
    html[data-ios-standalone="true"] #boot-splash {
      display: none !important;
    }
  </style>
  <script>
    (() => {
      const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const isStandalone = window.matchMedia?.("(display-mode: standalone)").matches ||
        navigator.standalone === true;
      if (isIos && isStandalone) {
        document.documentElement.dataset.iosStandalone = "true";
      }
    })();
  </script>
