services:
  redis:
    image: redis:7-alpine
    container_name: role-redis
    ports:
      - "6380:6379" # 6380 en host para no chocar con neutra-redis:6379 existente
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  redis_data:
