services:
  redis:
    image: redis:7-alpine
    container_name: role-redis
    ports:
      - "6380:6379" # 6380 en host para no chocar con neutra-redis:6379 existente
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Postgres efímero para tests (repositories + e2e). Los specs crean
  # una DATABASE fresca por archivo; nunca se usa para desarrollo.
  # fsync off: solo test, el DDL se reaplica en cada archivo.
  postgres-test:
    image: postgres:16-alpine
    container_name: role-postgres-test
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    ports:
      - "6432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: role_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
